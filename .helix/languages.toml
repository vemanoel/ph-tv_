[language-server.typescript-language-server]
command = "podman"
args = [
    "compose",
    "--file",
    ".container/compose.dev.yaml",
    "exec",
    "android",
    "typescript-language-server",
    "--stdio",
]

[[language]]
name = "json"
auto-format = true
formatter = { command = "podman", args = [
    "compose",
    "--file",
    ".container/compose.dev.yaml",
    "exec",
    "-T",
    "android",
    "npm",
    "exec",
    "prettier",
    "--use-tabs",
    "--stdin-filepath",
    "%{buffer_name}",
] }

[[language]]
name = "jsx"
auto-format = true
language-servers = ["typescript-language-server" ]
formatter = { command = "podman", args = [
    "compose",
    "--file",
    ".container/compose.dev.yaml",
    "exec",
    "-T",
    "android",
    "prettier",
    "--single-quote",
    "--jsx-single-quote",
    "--use-tabs",
    "--parser",
    "babel",
] }

[[language]]
name = "javascript"
auto-format = true
language-servers = [ "typescript-language-server" ]
formatter = { command = "podman", args = [
    "compose",
    "--file",
    ".container/compose.dev.yaml",
    "exec",
    "-T",
    "android",
    "prettier",
    "--single-quote",
    "--use-tabs",
    "--parser",
    "babel",
] }
