[language-server.typescript-language-server]
command = "podman"
args = [
    "compose",
    "exec",
    "development",
    "typescript-language-server",
    "--stdio",
]

[[language]]
name = "jsx"
auto-format = true
language-servers = ["typescript-language-server"]
formatter = { command = "podman", args = [
    "compose",
    "exec",
    "-T",
    "development",
    "prettier",
    "--single-quote",
    "--jsx-single-quote",
    "--use-tabs",
    "--parser",
    "babel",
    "--stdin-filepath",
    "%{buffer_name}",
] }

[[language]]
name = "javascript"
auto-format = true
language-servers = ["typescript-language-server"]
formatter = { command = "podman", args = [
    "compose",
    "exec",
    "-T",
    "development",
    "prettier",
    "--single-quote",
    "--use-tabs",
    "--parser",
    "babel",
    "--stdin-filepath",
    "%{buffer_name}",
] }
