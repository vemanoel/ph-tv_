[language-server.typescript-language-server]
command = "podman"
args = ["compose", "--file", ".container/compose.dev.yaml", "exec", "android", "typescript-language-server", "--stdio"]

[[language]]
name = "javascript"
auto-format = true
language-servers = ["gopls"]
formatter = { command = "podman", args = ["compose", "--file", ".container/compose.dev.yaml", "exec", "android", "gofmt", "-s"] }

[[language]]
name = "gomod"
auto-format = true
language-servers = ["gopls"]

[[language]]
name = "gowork"
auto-format = true
language-servers = ["gopls"]

[[language]]
name = "json"
formatter = { command = "jq", args = [".", "--indent", "4", "--tab"] }
