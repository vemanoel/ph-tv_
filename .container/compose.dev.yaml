services:
  dev:
    image: localhost/raccoon-dev
    deploy:
      resources:
        limits:
          cpus: 3.0
          memory: 8G
    privileged: true
    build:
      context: ..
      dockerfile: .container/Containerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace:Z
    stdin_open: true
    tty: true
    command: /bin/bash
    
