apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
     // Where package.json lives
    root = file("../..")

    // The folder where the react-native NPM package is
    reactNativeDir = file("../../node_modules/react-native")

    // The folder where the react-native Codegen package is
    codegenDir = file("../../node_modules/@react-native/codegen")

    // The cli.js file which is the React Native CLI entrypoint
    cliFile = file("../../node_modules/react-native/cli.js")

    // A list containing the node command and its flags
    nodeExecutableAndArgs = ["node"]

    // The command to run when bundling
    bundleCommand = "bundle"

    // A list of extra flags to pass to the 'bundle' commands
    // See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    extraPackagerArgs = []

    autolinkLibrariesWithApp()
}

android {
    namespace = "com.pornhubtv"

    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion

    splits {
        abi {
            enable = true
            reset()
            include("armeabi-v7a", "arm64-v8a")
            universalApk = false
        }
    }
    defaultConfig {
        applicationId = "com.pornhubtv"
        minSdkVersion = rootProject.ext.minSdkVersion
        targetSdkVersion = rootProject.ext.targetSdkVersion
        versionName = providers.gradleProperty("versionName").getOrElse("0.0.0-dev")
        versionCode = providers.gradleProperty("versionCode").getOrElse("0").toInteger()
    }
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            proguardFiles(
                android.getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }?.identifier

            output.outputFileName.set("pornhubtv-${output.versionName.get()}-${abi}.apk")
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
